name: Deploy NFC Landingpage to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: nfc-landingpage-deploy
  cancel-in-progress: true
jobs:
  deploy:
    name: FTP deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy website
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/
          local-dir: ./
          exclude: |
            **/.git*/**
            .git/**
            **/.github/**
            .github/**
            **/README.md
            **/.DS_Store

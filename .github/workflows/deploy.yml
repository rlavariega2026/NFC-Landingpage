name: Deploy NFC Landingpage to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: nfc-landingpage-deploy
  cancel-in-progress: true
jobs:
  deploy:
    name: Fix permissions and deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set correct Hostinger permissions
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" -e '
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            chmod 755 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage;
            chmod 755 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/assets;
            chmod 755 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/assets/servicios;
            chmod 644 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/index.html;
            chmod 644 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/.htaccess;
            chmod 644 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/assets/logo-lav-digital.png;
            chmod 644 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/assets/servicios/hero-dispositivos.jpg;
            chmod 644 /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/assets/servicios/tarjetas-nfc.jpg;
            bye
          '
      - name: Deploy website
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /domains/lavdigitalmkt.com/public_html/NFC-Landingpage/
          local-dir: ./
          exclude: |
            **/.git*/**
            .git/**
            **/.github/**
            .github/**
            **/README.md
            **/.DS_Store

name: Deploy NFC Landingpage to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nfc-landingpage-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish NFC landing page in tarjetas-nfc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy only to the existing tarjetas-nfc folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /domains/lavdigitalmkt.com/public_html/tarjetas-nfc/
          local-dir: ./
          exclude: |
            **/.git*/**
            .git/**
            **/.github/**
            .github/**
            **/README.md
            **/.DS_Store
